<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Belzona混合比">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Belzona混合比 計算アプリ</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--bg:#f8fafc;--card:#fff;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(36px + env(safe-area-inset-bottom))}
header{margin:4px 0 18px}
h1{font-size:21px;margin:0 0 5px}
.sub{font-size:13px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.section-title{font-size:16px;font-weight:700;margin:0 0 12px}
.ratio-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.colon{padding-bottom:13px;font-size:22px;font-weight:700;color:var(--muted)}
label{display:block;font-size:13px;color:#334155;margin:0 0 6px}
input,select{width:100%;min-height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);font-size:17px;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.stack{display:grid;gap:12px}
.unit-fixed{display:flex;align-items:center;min-height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#f8fafc;font-size:17px;font-weight:700}
.error{min-height:20px;color:#b91c1c;font-size:13px;margin:2px 2px 10px}
.results{display:grid;gap:10px}
.result{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.result-name{font-size:14px;color:#334155}
.result-value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.version{text-align:center;color:#94a3b8;font-size:11px;margin-top:14px}
@media (min-width:480px){.results{grid-template-columns:1fr 1fr}.result.total{grid-column:1/-1}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Belzona混合比 計算アプリ</h1>
    <div class="sub">比率と混合量を入力すると自動計算します。</div>
  </header>

  <section class="card">
    <div class="section-title">① 比率</div>
    <div class="ratio-grid">
      <div>
        <label for="ratioA">主剤 A</label>
        <input id="ratioA" type="number" inputmode="decimal" value="2" step="0.01" min="0">
      </div>
      <div class="colon">:</div>
      <div>
        <label for="ratioB">硬化剤 B</label>
        <input id="ratioB" type="number" inputmode="decimal" value="1" step="0.01" min="0">
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">② 混合量</div>
    <div class="stack">
      <div>
        <label for="mode">計算方法</label>
        <select id="mode">
          <option value="total">合計仕込みから計算</option>
          <option value="baseA">主剤（A）から計算</option>
        </select>
      </div>
      <div>
        <label id="amountLabel" for="amount">合計仕込み量</label>
        <input id="amount" type="number" inputmode="decimal" value="100" step="0.01" min="0">
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">③ 単位</div>
    <div class="unit-fixed">g</div>
  </section>

  <div id="error" class="error" aria-live="polite"></div>

  <section class="results" aria-label="計算結果">
    <div class="result">
      <div class="result-name">主剤（A）</div>
      <div class="result-value"><span id="valA">-</span> g</div>
    </div>
    <div class="result">
      <div class="result-name">硬化剤（B）</div>
      <div class="result-value"><span id="valB">-</span> g</div>
    </div>
    <div class="result total">
      <div class="result-name">合計</div>
      <div class="result-value"><span id="valT">-</span> g</div>
    </div>
  </section>

  <div class="version">更新版 v10 / 2026-09-24</div>
</main>

<script>
(function(){
  const ratioA=document.getElementById("ratioA");
  const ratioB=document.getElementById("ratioB");
  const mode=document.getElementById("mode");
  const amount=document.getElementById("amount");
  const amountLabel=document.getElementById("amountLabel");
  const error=document.getElementById("error");
  const valA=document.getElementById("valA");
  const valB=document.getElementById("valB");
  const valT=document.getElementById("valT");

  function num(v){
    const n=Number(String(v).replace(/,/g,"").trim());
    return Number.isFinite(n)?n:NaN;
  }
  function positive(n){return Number.isFinite(n)&&n>0}
  function fmt(n){
    if(!Number.isFinite(n)) return "-";
    return (Math.round(n*10)/10).toLocaleString("ja-JP",{maximumFractionDigits:1});
  }
  function calc(){
    error.textContent="";
    const a=num(ratioA.value);
    const b=num(ratioB.value);
    const q=num(amount.value);

    amountLabel.textContent=mode.value==="total" ? "合計仕込み量" : "主剤（A）の量";

    if(!positive(a)||!positive(b)){
      error.textContent="比率 A / B を0より大きい数値で入力してください。";
      valA.textContent=valB.textContent=valT.textContent="-";
      return;
    }
    if(!positive(q)){
      error.textContent=(mode.value==="total" ? "合計仕込み量" : "主剤（A）の量")+"を0より大きい数値で入力してください。";
      valA.textContent=valB.textContent=valT.textContent="-";
      return;
    }

    let A,B,T;
    if(mode.value==="total"){
      T=q;
      A=T*a/(a+b);
      B=T*b/(a+b);
    }else{
      A=q;
      B=A*b/a;
      T=A+B;
    }

    valA.textContent=fmt(A);
    valB.textContent=fmt(B);
    valT.textContent=fmt(T);
  }

  [ratioA,ratioB,mode,amount].forEach(function(el){
    el.addEventListener("input",calc);
    el.addEventListener("change",calc);
  });
  calc();

  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("./sw.js?v=10",{updateViaCache:"none"}).catch(function(){});
    });
  }
})();
</script>
</body>
</html>
