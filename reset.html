<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belzona混合比 更新</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;margin:0}
main{max-width:520px;margin:0 auto;padding:40px 20px}
.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:22px}
h1{font-size:20px;margin:0 0 12px}
p{line-height:1.7;color:#475569}
#status{font-weight:700;color:#0f172a}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>最新版へ更新しています</h1>
    <p id="status">古いオフラインデータを削除しています。</p>
  </div>
</main>
<script>
(async function(){
  const status=document.getElementById("status");
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.textContent="更新完了。最新版を開きます。";
  }catch(e){
    status.textContent="更新処理を続行します。";
  }
  setTimeout(function(){
    location.replace("./?v=7");
  },700);
})();
</script>
</body>
</html>
