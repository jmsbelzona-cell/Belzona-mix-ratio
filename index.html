<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Belzona混合比">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Belzona混合比 計算アプリ</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--bg:#f8fafc;--card:#fff;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:20px 14px 40px}
header{margin:4px 2px 18px}
h1{font-size:21px;margin:0 0 5px}
.sub{font-size:13px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.section-title{font-size:16px;font-weight:700;margin:0 0 12px}
.ratio-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.colon{padding-bottom:13px;font-size:22px;font-weight:700;color:var(--muted)}
label{display:block;font-size:13px;color:#334155;margin:0 0 6px}
input{width:100%;min-height:50px;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);font-size:18px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.error{min-height:20px;color:#b91c1c;font-size:13px;margin-top:10px}
.table-card{padding:0;overflow:hidden}
.table-head{padding:14px 16px;border-bottom:1px solid var(--line)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:360px}
th,td{padding:12px 10px;border-bottom:1px solid #edf2f7;text-align:right;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);background:#f8fafc}
td{font-size:15px}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
tbody tr:last-child td{border-bottom:0}
.total{font-weight:700}
.version{text-align:center;color:#94a3b8;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Belzona混合比 計算アプリ</h1>
    <div class="sub">比率を入力すると、100g〜1000gの配合重量を自動計算します。</div>
  </header>

  <section class="card">
    <div class="section-title">比率</div>
    <div class="ratio-grid">
      <div>
        <label for="ratioA">主剤 A</label>
        <input id="ratioA" type="number" inputmode="decimal" value="2" step="0.01" min="0">
      </div>
      <div class="colon">:</div>
      <div>
        <label for="ratioB">硬化剤 B</label>
        <input id="ratioB" type="number" inputmode="decimal" value="1" step="0.01" min="0">
      </div>
    </div>
    <div id="error" class="error"></div>
  </section>

  <section class="card table-card">
    <div class="table-head"><div class="section-title" style="margin:0">配合重量一覧</div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>混合後</th><th>主剤 A</th><th>硬化剤 B</th></tr></thead>
        <tbody id="mixTable">
          <tr data-total="100"><td class="total">100 g</td><td class="base">66.7 g</td><td class="hardener">33.3 g</td></tr>
          <tr data-total="200"><td class="total">200 g</td><td class="base">133.3 g</td><td class="hardener">66.7 g</td></tr>
          <tr data-total="300"><td class="total">300 g</td><td class="base">200 g</td><td class="hardener">100 g</td></tr>
          <tr data-total="400"><td class="total">400 g</td><td class="base">266.7 g</td><td class="hardener">133.3 g</td></tr>
          <tr data-total="500"><td class="total">500 g</td><td class="base">333.3 g</td><td class="hardener">166.7 g</td></tr>
          <tr data-total="600"><td class="total">600 g</td><td class="base">400 g</td><td class="hardener">200 g</td></tr>
          <tr data-total="700"><td class="total">700 g</td><td class="base">466.7 g</td><td class="hardener">233.3 g</td></tr>
          <tr data-total="800"><td class="total">800 g</td><td class="base">533.3 g</td><td class="hardener">266.7 g</td></tr>
          <tr data-total="900"><td class="total">900 g</td><td class="base">600 g</td><td class="hardener">300 g</td></tr>
          <tr data-total="1000"><td class="total">1000 g</td><td class="base">666.7 g</td><td class="hardener">333.3 g</td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <div class="version">更新版 v7 / 2026-09-24</div>
</main>

<script>
(function(){
  var ratioA=document.getElementById("ratioA");
  var ratioB=document.getElementById("ratioB");
  var error=document.getElementById("error");
  var table=document.getElementById("mixTable");

  function numberValue(v){
    var n=Number(String(v).replace(/,/g,"").replace(/^\s+|\s+$/g,""));
    return isFinite(n)?n:NaN;
  }
  function formatNumber(n){
    n=Math.round(n*10)/10;
    return String(n).replace(/\.0$/,"");
  }
  function render(){
    var a=numberValue(ratioA.value);
    var b=numberValue(ratioB.value);
    if(!(a>0) || !(b>0)){
      error.innerHTML="比率 A / B を0より大きい数値で入力してください。";
      return;
    }
    error.innerHTML="";
    var trs=table.getElementsByTagName("tr");
    for(var i=0;i<trs.length;i++){
      var total=Number(trs[i].getAttribute("data-total"));
      var base=total*a/(a+b);
      var hardener=total*b/(a+b);
      var baseCell=trs[i].getElementsByClassName("base")[0];
      var hardCell=trs[i].getElementsByClassName("hardener")[0];
      if(baseCell) baseCell.innerHTML=formatNumber(base)+" g";
      if(hardCell) hardCell.innerHTML=formatNumber(hardener)+" g";
    }
  }

  ratioA.oninput=render;
  ratioB.oninput=render;
  ratioA.onchange=render;
  ratioB.onchange=render;
  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("./sw.js?v=7",{updateViaCache:"none"}).catch(function(){});
    });
  }
})();
</script>
</body>
</html>
