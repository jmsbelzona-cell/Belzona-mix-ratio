<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Belzona混合比">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Belzona混合比 計算アプリ</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--bg:#f8fafc;--card:#fff;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:20px 14px calc(36px + env(safe-area-inset-bottom))}
header{margin:4px 2px 18px}
h1{font-size:21px;margin:0 0 5px}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.section-title{font-size:16px;font-weight:700;margin:0 0 12px}
.ratio-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.colon{padding-bottom:13px;font-size:22px;font-weight:700;color:var(--muted)}
label{display:block;font-size:13px;color:#334155;margin:0 0 6px}
input{width:100%;min-height:50px;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);font-size:18px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.error{min-height:20px;color:#b91c1c;font-size:13px;margin-top:10px}
.table-card{padding:0;overflow:hidden}
.table-head{padding:14px 16px;border-bottom:1px solid var(--line)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:12px 10px;border-bottom:1px solid #edf2f7;text-align:right;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);background:#f8fafc}
td{font-size:15px}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
tbody tr:last-child td{border-bottom:0}
.total{font-weight:700}
@media (max-width:420px){
  th,td{padding:11px 7px;font-size:14px}
  th:first-child,td:first-child{padding-left:12px}
  th:last-child,td:last-child{padding-right:12px}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Belzona混合比 計算アプリ</h1>
    <div class="sub">比率を入力すると、100g〜1000gの配合重量を自動計算します。</div>
  </header>

  <section class="card">
    <div class="section-title">比率</div>
    <div class="ratio-grid">
      <div>
        <label for="ratioA">主剤 A</label>
        <input id="ratioA" type="number" inputmode="decimal" value="2" step="0.01" min="0">
      </div>
      <div class="colon">:</div>
      <div>
        <label for="ratioB">硬化剤 B</label>
        <input id="ratioB" type="number" inputmode="decimal" value="1" step="0.01" min="0">
      </div>
    </div>
    <div id="error" class="error" aria-live="polite"></div>
  </section>

  <section class="card table-card">
    <div class="table-head">
      <div class="section-title" style="margin:0">配合重量一覧</div>
    </div>
    <div class="table-wrap">
      <table aria-label="配合重量一覧">
        <thead>
          <tr>
            <th>混合後</th>
            <th>主剤 A</th>
            <th>硬化剤 B</th>
          </tr>
        </thead>
        <tbody id="mixTable"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const ratioA=document.getElementById("ratioA");
const ratioB=document.getElementById("ratioB");
const error=document.getElementById("error");
const mixTable=document.getElementById("mixTable");

function num(v){
  const n=Number(String(v).replace(/,/g,"").trim());
  return Number.isFinite(n)?n:NaN;
}
function positive(n){return Number.isFinite(n)&&n>0}
function fmt(n){
  return (Math.round(n*10)/10).toLocaleString("ja-JP",{minimumFractionDigits:0,maximumFractionDigits:1});
}
function render(){
  error.textContent="";
  const a=num(ratioA.value);
  const b=num(ratioB.value);

  if(!positive(a)||!positive(b)){
    error.textContent="比率 A / B を0より大きい数値で入力してください。";
    mixTable.innerHTML='<tr><td colspan="3">比率を入力してください</td></tr>';
    return;
  }

  let rows="";
  for(let total=100; total<=1000; total+=100){
    const base=total*a/(a+b);
    const hardener=total*b/(a+b);
    rows += `<tr>
      <td class="total">${total.toLocaleString("ja-JP")} g</td>
      <td>${fmt(base)} g</td>
      <td>${fmt(hardener)} g</td>
    </tr>`;
  }
  mixTable.innerHTML=rows;
}

[ratioA,ratioB].forEach(el=>{
  el.addEventListener("input",render);
  el.addEventListener("change",render);
});
render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=4",{updateViaCache:"none"}).catch(()=>{}));
}
</script>
</body>
</html>
